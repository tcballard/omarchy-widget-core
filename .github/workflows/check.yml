name: Check Core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Export formatted source
        if: always()
        run: python3 -c 'import json,pathlib; print(json.dumps({"src/main.rs":pathlib.Path("src/main.rs").read_text()}))'
  sandbox:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python3 tests/sandbox.py --live
  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install -y libegl1 libopengl0
      - run: pip install PySide6==6.11.2
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: python3 tests/qml_smoke.py
      - run: python3 tests/runtime_integration.py target/debug/omarchy-widget
      - run: python3 tests/installer.py
      - run: python3 tests/sandbox.py
      - run: bash -n install-local && bash -n widget && bash -n host-launch && bash -n sandbox-launch
