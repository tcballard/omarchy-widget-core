name: Check Core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - name: Export formatted source
        if: always()
        run: python3 -c 'import json,pathlib; print(json.dumps({str(p):p.read_text() for p in pathlib.Path("src").glob("*.rs")}))'
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
  sandbox:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - run: python3 tests/sandbox.py --live
  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update
      - run: sudo apt-get install -y libegl1 libopengl0
      - run: pip install PySide6==6.11.2
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: python3 tests/qml_smoke.py
      - run: python3 tests/runtime_integration.py target/debug/omarchy-widget
      - run: python3 tests/installer.py
      - run: python3 tests/sandbox.py
      - run: bash -n install-local && bash -n widget && bash -n host-launch && bash -n sandbox-launch
  wayland:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - run: bash build-wayland-filter
      - run: python3 tests/wayland_filter.py target/wl-mitm-source/target/release/wl-mitm target/debug/omarchy-widget
  resources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
      - name: Exercise resource isolation in a disposable user session
        run: |
          sudo useradd --create-home --shell /bin/bash widgettest
          test_uid=$(id -u widgettest)
          sudo mkdir -p "/run/systemd/system/user@${test_uid}.service.d"
          printf '[Service]\nDelegate=cpu memory pids\n' | sudo tee "/run/systemd/system/user@${test_uid}.service.d/controllers.conf" >/dev/null
          sudo systemctl daemon-reload
          sudo loginctl enable-linger widgettest
          sudo systemctl start "user@${test_uid}.service"
          sudo install -Dm755 target/debug/omarchy-widget /tmp/widget-resource-ci/omarchy-widget
          sudo install -m644 tests/resources.py /tmp/widget-resource-ci/resources.py
          sudo -u widgettest env "XDG_RUNTIME_DIR=/run/user/${test_uid}" "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${test_uid}/bus" python3 /tmp/widget-resource-ci/resources.py /tmp/widget-resource-ci/omarchy-widget --live
