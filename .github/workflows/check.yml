name: Check Core
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Formatted source
        run: cat src/main.rs
  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PySide6==6.11.2
      - run: python3 tests/qml_smoke.py
      - run: bash -n install-local
